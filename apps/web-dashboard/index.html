<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise SaaS Operations Suite</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="light-theme">
  <div id="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <span class="brand-title">AURA SAAS</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#overview" class="nav-item active" id="nav-overview">
          <span class="nav-icon">📊</span> Overview
        </a>
        <a href="#tenants" class="nav-item" id="nav-tenants">
          <span class="nav-icon">🏢</span> Multi-Tenancy
        </a>
        <a href="#finance" class="nav-item" id="nav-finance">
          <span class="nav-icon">💰</span> Financial Ledger
        </a>
        <a href="#billing" class="nav-item" id="nav-billing">
          <span class="nav-icon">💳</span> SaaS Subscriptions
        </a>
        <a href="#hrms" class="nav-item" id="nav-hrms">
          <span class="nav-icon">👥</span> HRMS & Payroll
        </a>
        <a href="#crm" class="nav-item" id="nav-crm">
          <span class="nav-icon">🎯</span> Sales CRM
        </a>
        <a href="#inventory" class="nav-item" id="nav-inventory">
          <span class="nav-icon">📦</span> Stock & Logistics
        </a>
        <a href="#audit" class="nav-item" id="nav-audit">
          <span class="nav-icon">🛡️</span> Security & Audit
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="avatar">EA</div>
          <div class="user-details">
            <div class="user-name">Enterprise Admin</div>
            <div class="user-role">Super Administrator</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Body -->
    <main class="main-content">
      <header class="top-navbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="global-search-input" placeholder="Search tenants, accounts, employees, leads, SKUs... (Ctrl + K)">
        </div>
        <div class="top-actions">
          <span class="badge-status online">● System Operational</span>
          <button class="btn btn-secondary" onclick="alert('Notification Center: All systems functioning normally')">🔔 Notifications (3)</button>
          <div class="tenant-selector">
            <select id="active-tenant-selector">
              <option value="global">All Tenants (Global View)</option>
              <option value="stark">Stark Industries (Enterprise)</option>
              <option value="acme">Acme Corp (Pro Tier)</option>
              <option value="cyberdyne">Cyberdyne Systems (Starter)</option>
            </select>
          </div>
        </div>
      </header>

      <!-- Dynamic Page Container -->
      <div id="page-content" class="content-body">
        <!-- SPA Pages dynamically injected here -->
      </div>
    </main>
  </div>

  <!-- Reusable Interactive Modal Container -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal-container" class="modal-container">
      <div class="modal-header">
        <h3 id="modal-title">Action Dialog</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
